{% extends "base.html" %}
{% block title %}VK Stats{% endblock %}
{% block content %}
<div class="glass-effect">
    <h1 class="text-center gradient-layer">VK Stats</h1>
    <table class="table table-bordered mt-4 neumorphism-effect">
        <thead>
            <tr>
                <th>Parameter</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            {% for key, value in stats.items() %}
            <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
